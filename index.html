<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY - Tim Burton Mural Completo</title>
<style>
  body{margin:0;background:#030406;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#a0b0c0}
  #wall{position:relative;width:95vw;max-width:850px;aspect-ratio:16/9;background:#050608;border:8px solid #111;box-shadow:0 0 60px rgba(123,31,162,0.4);overflow:hidden;border-radius:12px}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  div > button{background:#7b1fa2;color:white;border:none;padding:12px 24px;border-radius:8px;font-weight:bold;cursor:pointer;margin:10px;transition:0.2s;box-shadow:0 4px 15px rgba(123,31,162,0.4);font-size:14px}
  div > button:hover{background:#9c27b0;transform:scale(1.08)}
</style>
</head>
<body>
<h3 style="opacity:.8;letter-spacing:5px;color:#ce93d8;margin-bottom:12px">TIM BURTON x KEY</h3>
<div id="wall">
  <canvas id="bg"></canvas>
  <canvas id="paint"></canvas>
</div>
<div>
  <button onclick="start()">▶ PINTAR</button>
  <button onclick="clearCanv()">↺ BORRAR</button>
</div>

<script>
const paint = document.getElementById('paint'), bg = document.getElementById('bg');
const pCtx = paint.getContext('2d'), bCtx = bg.getContext('2d');

function resize() {
  [paint, bg].forEach(c => { c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; });
  drawBackground(0);
}

let animFrame = 0;
let bats = [
  {x: 700, y: 120, speed: 1.2, size: 10, wing: 0},
  {x: 780, y: 80, speed: 1.5, size: 8, wing: 2},
  {x: 550, y: 150, speed: 0.9, size: 12, wing: 1}
];

// Dibujar el fondo épico de Tim Burton (ocupa la parte superior y central sin ser tapado)
function drawBackground(time) {
  const w = bg.width, h = bg.height;
  bCtx.clearRect(0, 0, w, h);
  
  // 1. Cielo nocturno místico
  let grad = bCtx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#020305');
  grad.addColorStop(0.5, '#0a0b16');
  grad.addColorStop(1, '#160922');
  bCtx.fillStyle = grad;
  bCtx.fillRect(0, 0, w, h);

  // 2. Luna gigante brillante en el cielo superior
  bCtx.fillStyle = 'rgba(210, 235, 255, 0.08)';
  bCtx.beginPath(); bCtx.arc(w * 0.78, h * 0.25, 130, 0, Math.PI * 2); bCtx.fill();
  bCtx.fillStyle = 'rgba(220, 242, 255, 0.9)';
  bCtx.beginPath(); bCtx.arc(w * 0.78, h * 0.25, 75, 0, Math.PI * 2); bCtx.fill();
  
  // Cráteres de la luna
  bCtx.fillStyle = 'rgba(170, 195, 210, 0.35)';
  bCtx.beginPath(); bCtx.arc(w * 0.75, h * 0.21, 16, 0, Math.PI * 2); bCtx.fill();
  bCtx.beginPath(); bCtx.arc(w * 0.81, h * 0.30, 11, 0, Math.PI * 2); bCtx.fill();

  // 3. Colina en espiral (Spiral Hill)
  bCtx.fillStyle = '#040507';
  bCtx.beginPath();
  bCtx.moveTo(w * 0.45, h * 0.6);
  bCtx.quadraticCurveTo(w * 0.6, h * 0.32, w * 0.75, h * 0.38);
  bCtx.bezierCurveTo(w * 0.85, h * 0.42, w * 0.78, h * 0.22, w * 0.72, h * 0.25);
  bCtx.bezierCurveTo(w * 0.67, h * 0.27, w * 0.69, h * 0.35, w * 0.75, h * 0.35);
  bCtx.lineTo(w, h * 0.6);
  bCtx.closePath();
  bCtx.fill();

  let floatOffset = Math.sin(time * 0.04) * 6;

  // 4. JACK SKELLINGTON (Grande y totalmente visible a la izquierda)
  bCtx.save();
  let jx = w * 0.20, jy = h * 0.28 + floatOffset;
  
  // Traje a rayas
  bCtx.fillStyle = '#08080d';
  bCtx.beginPath(); bCtx.ellipse(jx, jy + 85, 42, 70, 0, 0, Math.PI * 2); bCtx.fill();
  // Pajarita murciélago
  bCtx.fillStyle = '#0a0b10';
  bCtx.beginPath(); 
  bCtx.moveTo(jx, jy + 35); 
  bCtx.lineTo(jx - 32, jy + 22); bCtx.lineTo(jx - 22, jy + 48); 
  bCtx.lineTo(jx, jy + 35); 
  bCtx.lineTo(jx + 22, jy + 48); bCtx.lineTo(jx + 32, jy + 22); 
  bCtx.closePath(); bCtx.fill();
  
  // Calavera
  bCtx.fillStyle = '#f0f4f8';
  bCtx.beginPath(); bCtx.arc(jx, jy, 40, 0, Math.PI * 2); bCtx.fill();
  bCtx.strokeStyle = '#040507'; bCtx.lineWidth = 3; bCtx.stroke();

  // Ojos icónicos
  bCtx.fillStyle = '#040507';
  bCtx.beginPath(); 
  bCtx.ellipse(jx - 13, jy - 4, 9, 13, -0.2, 0, Math.PI * 2); 
  bCtx.ellipse(jx + 13, jy - 4, 9, 13, 0.2, 0, Math.PI * 2); 
  bCtx.fill();
  
  // Sonrisa cosida
  bCtx.lineWidth = 3; bCtx.strokeStyle = '#040507';
  bCtx.beginPath(); bCtx.arc(jx, jy + 10, 20, 0.1 * Math.PI, 0.9 * Math.PI); bCtx.stroke();
  for(let i = -14; i <= 14; i += 6) {
    bCtx.beginPath(); bCtx.moveTo(jx + i, jy + 4); bCtx.lineTo(jx + i, jy + 18); bCtx.stroke();
  }
  bCtx.restore();

  // 5. SALLY (Grande y totalmente visible a la derecha)
  bCtx.save();
  let sx = w * 0.86, sy = h * 0.32 - floatOffset;
  
  // Vestido de parches
  bCtx.fillStyle = '#311b92';
  bCtx.beginPath(); bCtx.ellipse(sx, sy + 75, 38, 55, 0, 0, Math.PI * 2); bCtx.fill();
  // Cabello rojo
  bCtx.fillStyle = '#b71c1c';
  bCtx.beginPath();
  bCtx.moveTo(sx - 28, sy - 20); bCtx.lineTo(sx + 28, sy - 20);
  bCtx.lineTo(sx + 42, sy + 38); bCtx.lineTo(sx - 42, sy + 38);
  bCtx.closePath(); bCtx.fill();
  
  // Cara pálida
  bCtx.fillStyle = '#e8f5e9';
  bCtx.beginPath(); bCtx.arc(sx, sy, 30, 0, Math.PI * 2); bCtx.fill();
  bCtx.strokeStyle = '#040507'; bCtx.lineWidth = 2.5; bCtx.stroke();

  // Ojos melancólicos
  bCtx.fillStyle = '#040507';
  bCtx.beginPath(); bCtx.arc(sx - 10, sy - 3, 5, 0, Math.PI * 2); bCtx.arc(sx + 10, sy - 3, 5, 0, Math.PI * 2); bCtx.fill();
  bCtx.restore();

  // 6. Murciélagos volando en el cielo
  bats.forEach(b => {
    b.x -= b.speed;
    if(b.x < -50) b.x = w + 50;
    b.wing += 0.22;
    let wo = Math.sin(b.wing) * b.size;
    bCtx.fillStyle = '#020304';
    bCtx.beginPath();
    bCtx.moveTo(b.x, b.y);
    bCtx.quadraticCurveTo(b.x - b.size, b.y - b.size - wo, b.x - b.size * 2, b.y - wo * 0.5);
    bCtx.quadraticCurveTo(b.x - b.size, b.y + 2, b.x, b.y + 4);
    bCtx.quadraticCurveTo(b.x + b.size, b.y + 2, b.x + b.size * 2, b.y - wo * 0.5);
    bCtx.quadraticCurveTo(b.x + b.size, b.y - b.size - wo, b.x, b.y);
    bCtx.fill();
  });

  // 7. LA BARDA DE LADRILLOS (Solo en el 40% inferior para no tapar el fondo)
  bCtx.fillStyle = '#0b0d14';
  bCtx.fillRect(0, h * 0.6, w, h * 0.4);

  bCtx.strokeStyle = '#050608';
  bCtx.lineWidth = 3;
  let rowH = 32, colW = 70;
  for(let y = h * 0.6; y < h; y += rowH) {
    bCtx.beginPath(); bCtx.moveTo(0, y); bCtx.lineTo(w, y); bCtx.stroke();
  }
  let offset = 0;
  for(let y = h * 0.6; y < h; y += rowH) {
    offset = (offset === 0) ? colW / 2 : 0;
    for(let x = offset; x < w; x += colW) {
      bCtx.beginPath(); bCtx.moveTo(x, y); bCtx.lineTo(x, y + rowH); bCtx.stroke();
    }
  }
}

// Trazos de las letras KEY adaptados a la barda inferior
const letterGroups = [
  // Letra K
  [
    {x:0.18, y:0.67, ex:0.18, ey:0.91, width:35},
    {x:0.18, y:0.79, ex:0.31, ey:0.67, width:28},
    {x:0.22, y:0.75, ex:0.33, ey:0.91, width:28}
  ],
  // Letra E
  [
    {x:0.42, y:0.67, ex:0.42, ey:0.91, width:35},
    {x:0.42, y:0.67, ex:0.58, ey:0.69, width:24},
    {x:0.42, y:0.79, ex:0.54, ey:0.81, width:22},
    {x:0.42, y:0.91, ex:0.58, ey:0.89, width:24}
  ],
  // Letra Y
  [
    {x:0.68, y:0.67, ex:0.75, ey:0.79, width:28},
    {x:0.83, y:0.67, ex:0.75, ey:0.79, width:28},
    {x:0.75, y:0.79, ex:0.75, ey:0.91, width:30}
  ]
];

function spray(x, y, color, radius, count) {
  for(let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2, d = Math.random() * radius;
    pCtx.fillStyle = color; 
    pCtx.globalAlpha = 0.5 + Math.random() * 0.4;
    pCtx.beginPath();
    pCtx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.random() * 3 + 0.8, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
}

// Mini personaje estacionario pintando en la barda
function drawStationaryCharacter(stationX, stationY, sprayTargetX, sprayTargetY, isPainting) {
  pCtx.save();
  let charX = stationX;
  let charY = stationY;

  // Sombra
  pCtx.fillStyle = 'rgba(0,0,0,0.65)';
  pCtx.beginPath();
  pCtx.ellipse(charX + 18, charY + 10, 18, 5, 0, 0, Math.PI * 2);
  pCtx.fill();

  pCtx.strokeStyle = '#030406';
  pCtx.lineWidth = 3.5;
  pCtx.lineCap = 'round';
  pCtx.lineJoin = 'round';

  // Piernas
  pCtx.beginPath();
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 10, charY + 12);
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 26, charY + 12);
  pCtx.stroke();

  // Gabardina
  pCtx.fillStyle = '#0c0d14';
  pCtx.beginPath();
  pCtx.moveTo(charX + 10, charY - 22);
  pCtx.lineTo(charX + 26, charY - 22);
  pCtx.lineTo(charX + 25, charY);
  pCtx.lineTo(charX + 11, charY);
  pCtx.closePath();
  pCtx.fill();
  pCtx.stroke();

  // Cabeza
  pCtx.fillStyle = '#e2e8f0';
  pCtx.beginPath();
  pCtx.arc(charX + 18, charY - 32, 14, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.stroke();

  // Cabello alborotado
  pCtx.fillStyle = '#030406';
  pCtx.beginPath();
  pCtx.moveTo(charX + 6, charY - 38);
  pCtx.lineTo(charX + 10, charY - 50);
  pCtx.lineTo(charX + 14, charY - 42);
  pCtx.lineTo(charX + 18, charY - 53);
  pCtx.lineTo(charX + 22, charY - 42);
  pCtx.lineTo(charX + 26, charY - 48);
  pCtx.lineTo(charX + 30, charY - 36);
  pCtx.fill();

  // Ojos
  pCtx.beginPath();
  pCtx.arc(charX + 13, charY - 34, 3.5, 0, Math.PI * 2);
  pCtx.arc(charX + 22, charY - 34, 3.5, 0, Math.PI * 2);
  pCtx.fill();

  // Brazo y spray
  if (isPainting) {
    pCtx.beginPath();
    pCtx.moveTo(charX + 18, charY - 18);
    pCtx.lineTo(sprayTargetX, sprayTargetY);
    pCtx.stroke();

    pCtx.fillStyle = '#9c27b0';
    pCtx.fillRect(sprayTargetX - 7, sprayTargetY - 11, 15, 20);
    pCtx.fillStyle = '#00e5ff';
    pCtx.fillRect(sprayTargetX - 4, sprayTargetY - 15, 8, 4);
  }

  pCtx.restore();
}

function drawGraffiti(p) {
  animFrame++;
  drawBackground(animFrame);
  
  pCtx.clearRect(0, 0, paint.width, paint.height);
  
  const colors = {
    fill: 'rgba(156, 39, 176, 0.95)',
    glow: 'rgba(0, 229, 255, 0.9)',
    outline: 'rgba(3, 4, 6, 0.95)'
  };

  let groupIndex = Math.floor(p * 3);
  if(groupIndex > 2) groupIndex = 2;

  let groupProgress = (p * 3) - groupIndex;
  if(groupProgress > 1) groupProgress = 1;

  const characterStations = [
    {x: paint.width * 0.06, y: paint.height * 0.92},
    {x: paint.width * 0.32, y: paint.height * 0.92},
    {x: paint.width * 0.59, y: paint.height * 0.92}
  ];

  let currentStation = characterStations[groupIndex];
  let currentStrokeTargetX = paint.width * 0.2;
  let currentStrokeTargetY = paint.height * 0.75;

  for (let g = 0; g <= groupIndex && g < letterGroups.length; g++) {
    let strokes = letterGroups[g];
    let strokeCount = strokes.length;
    
    let activeStrokesCount = (g === groupIndex) ? Math.ceil(groupProgress * strokeCount) : strokeCount;
    if(activeStrokesCount < 1) activeStrokesCount = 1;

    for (let s = 0; s < activeStrokesCount && s < strokeCount; s++) {
      let st = strokes[s];
      let subSteps = 30;
      let sp = 1.0;
      if (g === groupIndex && s === activeStrokesCount - 1) {
        let subP = (groupProgress * strokeCount) - s;
        sp = Math.max(0, Math.min(1, subP));
      }

      for (let i = 0; i <= subSteps * sp; i++) {
        let t = i / subSteps;
        let x = (st.x + (st.ex - st.x) * t) * paint.width;
        let y = (st.y + (st.ey - st.y) * t) * paint.height;

        currentStrokeTargetX = x;
        currentStrokeTargetY = y;

        let r = st.width * (0.8 + Math.sin(t * Math.PI) * 0.2);

        if (i % 2 === 0) spray(x + 4, y + 4, colors.outline, r * 1.2, 10);
        if (i % 3 === 0) spray(x, y, colors.glow, r * 0.55, 12);
        spray(x, y, colors.fill, r, 18);

        if (Math.random() > 0.955) {
          let dripLen = 20 + Math.random() * 30;
          for (let d = 0; d < dripLen; d += 2) {
            pCtx.fillStyle = colors.fill;
            pCtx.globalAlpha = 0.85;
            pCtx.fillRect(x + (Math.random() - 0.5) * 3, y + d, 2.5, 4);
          }
          pCtx.globalAlpha = 1;
        }
      }
    }
  }

  if (p < 1) {
    drawStationaryCharacter(currentStation.x, currentStation.y, currentStrokeTargetX, currentStrokeTargetY, true);
  }
}

let anim = null;
function start() {
  cancelAnimationFrame(anim);
  let p = 0;
  (function loop() {
    p += 0.0022;
    if (p > 1) p = 1;
    drawGraffiti(p);
    if (p < 1) anim = requestAnimationFrame(loop);
  })();
}

function clearCanv() {
  cancelAnimationFrame(anim);
  pCtx.clearRect(0, 0, paint.width, paint.height);
  drawBackground(0);
}

window.addEventListener('resize', resize);
resize();
drawBackground(0);
</script>
</body>
</html>
