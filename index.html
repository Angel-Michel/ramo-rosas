<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY - Tim Burton Canvas Graffiti</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: #020203;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Creepster', cursive;
    color: #a0b0c0;
  }
  h3 {
    font-size: 2.5rem;
    letter-spacing: 8px;
    color: #ce93d8;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(123,31,162,0.8);
    font-weight: normal;
  }
  #wall {
    position: relative;
    width: 95vw;
    max-width: 900px;
    aspect-ratio: 16/9;
    background: #050608;
    border: 6px solid #1a0b2e;
    box-shadow: 0 0 80px rgba(90, 20, 120, 0.6), inset 0 0 50px #000;
    overflow: hidden;
    border-radius: 8px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 20px;
  }
  button {
    background: #11081a;
    color: #ce93d8;
    border: 2px solid #7b1fa2;
    padding: 10px 30px;
    border-radius: 4px;
    font-family: 'Creepster', cursive;
    font-size: 1.5rem;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(123,31,162,0.3);
  }
  button:hover {
    background: #2a0b45;
    color: #fff;
    box-shadow: 0 0 25px rgba(123,31,162,0.8);
    transform: translateY(-2px);
  }
</style>
</head>
<body>
<h3>TIM BURTON x KEY</h3>
<div id="wall">
  <canvas id="bg"></canvas>
  <canvas id="paint"></canvas>
</div>
<div class="controls">
  <button onclick="start()">▶ PINTAR</button>
  <button onclick="clearCanv()">↺ BORRAR</button>
</div>

<script>
const paint = document.getElementById('paint'), bg = document.getElementById('bg');
const pCtx = paint.getContext('2d'), bCtx = bg.getContext('2d');

function resize() {
  [paint, bg].forEach(c => { c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; });
  drawBackground(0);
}

let animFrame = 0;
let bats = [
  {x: 650, y: 120, speed: 1.2, size: 12, wing: 0},
  {x: 750, y: 80, speed: 1.8, size: 9, wing: 2},
  {x: 500, y: 160, speed: 1.0, size: 15, wing: 1},
  {x: 200, y: 100, speed: 1.5, size: 10, wing: 0.5}
];

function drawBackground(time) {
  const w = bg.width, h = bg.height;
  bCtx.clearRect(0, 0, w, h);
  
  // 1. Cielo nocturno con mayor contraste
  let grad = bCtx.createLinearGradient(0, 0, 0, h * 0.8);
  grad.addColorStop(0, '#020205');
  grad.addColorStop(0.5, '#150822');
  grad.addColorStop(1, '#2c1b4d');
  bCtx.fillStyle = grad;
  bCtx.fillRect(0, 0, w, h);

  // 2. Luna gigante brillante con resplandor
  bCtx.save();
  bCtx.shadowColor = 'rgba(210, 235, 255, 0.9)';
  bCtx.shadowBlur = 60;
  bCtx.fillStyle = '#e1f2ff';
  bCtx.beginPath(); bCtx.arc(w * 0.76, h * 0.28, 90, 0, Math.PI * 2); bCtx.fill();
  bCtx.restore();
  
  // Cráteres de la luna
  bCtx.fillStyle = 'rgba(165, 190, 205, 0.3)';
  bCtx.beginPath(); bCtx.arc(w * 0.72, h * 0.23, 22, 0, Math.PI * 2); bCtx.fill();
  bCtx.beginPath(); bCtx.arc(w * 0.81, h * 0.35, 15, 0, Math.PI * 2); bCtx.fill();
  bCtx.beginPath(); bCtx.arc(w * 0.76, h * 0.30, 10, 0, Math.PI * 2); bCtx.fill();

  // 3. Colina en espiral (Spiral Hill) con mayor definición
  bCtx.fillStyle = '#040507';
  bCtx.strokeStyle = '#150822';
  bCtx.lineWidth = 4;
  bCtx.beginPath();
  bCtx.moveTo(w * 0.35, h * 0.6);
  bCtx.quadraticCurveTo(w * 0.55, h * 0.30, w * 0.72, h * 0.40);
  bCtx.bezierCurveTo(w * 0.88, h * 0.48, w * 0.80, h * 0.18, w * 0.70, h * 0.22);
  bCtx.bezierCurveTo(w * 0.63, h * 0.25, w * 0.67, h * 0.38, w * 0.73, h * 0.37);
  bCtx.lineTo(w, h * 0.6);
  bCtx.closePath();
  bCtx.fill();
  bCtx.stroke();

  // 4. Árboles góticos retorcidos
  bCtx.strokeStyle = '#020304';
  bCtx.lineWidth = 12;
  bCtx.lineCap = 'round';
  bCtx.beginPath();
  bCtx.moveTo(w * 0.08, h * 0.6);
  bCtx.quadraticCurveTo(w * 0.12, h * 0.35, w * 0.05, h * 0.15);
  bCtx.stroke();
  // Rama
  bCtx.lineWidth = 6;
  bCtx.beginPath();
  bCtx.moveTo(w * 0.10, h * 0.35);
  bCtx.quadraticCurveTo(w * 0.18, h * 0.25, w * 0.22, h * 0.30);
  bCtx.stroke();

  let floatOffset = Math.sin(time * 0.035) * 6;

  // 5. JACK SKELLINGTON (Mejorado)
  bCtx.save();
  let jx = w * 0.22, jy = h * 0.26 + floatOffset;
  
  // Cuerpo estilizado
  bCtx.fillStyle = '#08080d';
  bCtx.beginPath();
  bCtx.moveTo(jx, jy + 20);
  bCtx.lineTo(jx - 15, jy + 110);
  bCtx.lineTo(jx + 15, jy + 110);
  bCtx.closePath();
  bCtx.fill();
  
  // Rayas blancas del traje
  bCtx.strokeStyle = '#e2e8f0'; 
  bCtx.lineWidth = 1.5;
  for(let i = -10; i <= 10; i += 4) {
    bCtx.beginPath(); bCtx.moveTo(jx + i, jy + 30); bCtx.lineTo(jx + (i*1.5), jy + 110); bCtx.stroke();
  }

  // Pajarita murciélago
  bCtx.fillStyle = '#020204';
  bCtx.beginPath(); 
  bCtx.moveTo(jx, jy + 25); 
  bCtx.lineTo(jx - 40, jy + 10); bCtx.lineTo(jx - 25, jy + 45); 
  bCtx.lineTo(jx, jy + 30); 
  bCtx.lineTo(jx + 25, jy + 45); bCtx.lineTo(jx + 40, jy + 10); 
  bCtx.closePath(); bCtx.fill();
  
  // Calavera
  bCtx.fillStyle = '#f0f4f8';
  bCtx.beginPath(); bCtx.arc(jx, jy, 25, 0, Math.PI * 2); bCtx.fill();
  
  // Ojos hundidos
  bCtx.fillStyle = '#020203';
  bCtx.beginPath(); 
  bCtx.ellipse(jx - 8, jy - 5, 7, 10, -0.2, 0, Math.PI * 2); 
  bCtx.ellipse(jx + 8, jy - 5, 7, 10, 0.2, 0, Math.PI * 2); 
  bCtx.fill();
  
  // Sonrisa cosida
  bCtx.lineWidth = 2; bCtx.strokeStyle = '#020203';
  bCtx.beginPath(); bCtx.arc(jx, jy + 10, 14, 0.1 * Math.PI, 0.9 * Math.PI); bCtx.stroke();
  for(let i = -10; i <= 10; i += 4) {
    bCtx.beginPath(); bCtx.moveTo(jx + i, jy + 6); bCtx.lineTo(jx + i, jy + 16); bCtx.stroke();
  }
  bCtx.restore();

  // 6. Niebla baja antes del muro
  let fogGrad = bCtx.createLinearGradient(0, h * 0.45, 0, h * 0.6);
  fogGrad.addColorStop(0, 'rgba(44, 27, 77, 0)');
  fogGrad.addColorStop(1, 'rgba(44, 27, 77, 0.6)');
  bCtx.fillStyle = fogGrad;
  bCtx.fillRect(0, h * 0.45, w, h * 0.15);

  // 7. PARED DE LADRILLOS (Más oscura y definida)
  bCtx.fillStyle = '#07080c';
  bCtx.fillRect(0, h * 0.6, w, h * 0.4);

  bCtx.strokeStyle = '#020203';
  bCtx.lineWidth = 4;
  let rowH = 35, colW = 75;
  for(let y = h * 0.6; y < h; y += rowH) {
    bCtx.beginPath(); bCtx.moveTo(0, y); bCtx.lineTo(w, y); bCtx.stroke();
  }
  let offset = 0;
  for(let y = h * 0.6; y < h; y += rowH) {
    offset = (offset === 0) ? colW / 2 : 0;
    for(let x = offset; x < w; x += colW) {
      bCtx.beginPath(); bCtx.moveTo(x, y); bCtx.lineTo(x, y + rowH); bCtx.stroke();
    }
  }

  // Murciélagos volando (dibujados encima)
  bats.forEach(b => {
    b.x -= b.speed;
    if(b.x < -50) b.x = w + 50;
    b.wing += 0.22;
    let wo = Math.sin(b.wing) * b.size;
    bCtx.fillStyle = '#000';
    bCtx.beginPath();
    bCtx.moveTo(b.x, b.y);
    bCtx.quadraticCurveTo(b.x - b.size, b.y - b.size - wo, b.x - b.size * 2, b.y - wo * 0.5);
    bCtx.quadraticCurveTo(b.x - b.size, b.y + 2, b.x, b.y + 4);
    bCtx.quadraticCurveTo(b.x + b.size, b.y + 2, b.x + b.size * 2, b.y - wo * 0.5);
    bCtx.quadraticCurveTo(b.x + b.size, b.y - b.size - wo, b.x, b.y);
    bCtx.fill();
  });
}

// Trazos para formar KEY
const letterGroups = [
  [
    {x:0.18, y:0.65, ex:0.18, ey:0.92, width:45},
    {x:0.18, y:0.77, ex:0.34, ey:0.65, width:35},
    {x:0.22, y:0.74, ex:0.36, ey:0.92, width:35}
  ],
  [
    {x:0.42, y:0.65, ex:0.42, ey:0.92, width:45},
    {x:0.42, y:0.65, ex:0.62, ey:0.67, width:32},
    {x:0.42, y:0.78, ex:0.58, ey:0.80, width:30},
    {x:0.42, y:0.92, ex:0.62, ey:0.90, width:32}
  ],
  [
    {x:0.68, y:0.65, ex:0.77, ey:0.79, width:36},
    {x:0.86, y:0.65, ex:0.77, ey:0.79, width:36},
    {x:0.77, y:0.79, ex:0.77, ey:0.94, width:40}
  ]
];

// Función spray mejorada para mayor densidad
function spray(x, y, color, radius, count) {
  pCtx.fillStyle = color; 
  for(let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2;
    // Concentrar partículas más cerca del centro
    let d = (Math.random() * Math.random()) * radius; 
    pCtx.globalAlpha = 0.7 + Math.random() * 0.3;
    pCtx.beginPath();
    pCtx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.random() * 3 + 1.5, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
}

function drawStationaryCharacter(stationX, stationY, sprayTargetX, sprayTargetY, isPainting) {
  pCtx.save();
  let charX = stationX;
  let charY = stationY;

  // Sombra
  pCtx.fillStyle = 'rgba(0,0,0,0.8)';
  pCtx.beginPath();
  pCtx.ellipse(charX + 18, charY + 15, 22, 6, 0, 0, Math.PI * 2);
  pCtx.fill();

  pCtx.strokeStyle = '#000';
  pCtx.lineWidth = 4;
  pCtx.lineCap = 'round';

  // Piernas
  pCtx.beginPath();
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 10, charY + 15);
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 26, charY + 15);
  pCtx.stroke();

  // Gabardina
  pCtx.fillStyle = '#0a0a0f';
  pCtx.beginPath();
  pCtx.moveTo(charX + 8, charY - 25);
  pCtx.lineTo(charX + 28, charY - 25);
  pCtx.lineTo(charX + 30, charY + 2);
  pCtx.lineTo(charX + 6, charY + 2);
  pCtx.closePath();
  pCtx.fill();
  pCtx.stroke();

  // Cabeza
  pCtx.fillStyle = '#fff';
  pCtx.beginPath();
  pCtx.arc(charX + 18, charY - 35, 16, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.stroke();

  // Ojos grandes estilo Burton
  pCtx.fillStyle = '#000';
  pCtx.beginPath();
  pCtx.arc(charX + 12, charY - 36, 5, 0, Math.PI * 2);
  pCtx.arc(charX + 24, charY - 36, 5, 0, Math.PI * 2);
  pCtx.fill();

  // Brazo y spray
  if (isPainting) {
    pCtx.beginPath();
    pCtx.moveTo(charX + 18, charY - 20);
    pCtx.lineTo(sprayTargetX, sprayTargetY);
    pCtx.stroke();

    // Bote de spray
    pCtx.fillStyle = '#7b1fa2';
    pCtx.fillRect(sprayTargetX - 8, sprayTargetY - 12, 16, 24);
    pCtx.fillStyle = '#00e5ff';
    pCtx.fillRect(sprayTargetX - 4, sprayTargetY - 16, 8, 4);
    
    // Partículas saliendo del bote
    spray(sprayTargetX, sprayTargetY - 20, 'rgba(0, 229, 255, 0.8)', 15, 5);
  }

  pCtx.restore();
}

function drawGraffiti(p) {
  animFrame++;
  drawBackground(animFrame);
  
  pCtx.clearRect(0, 0, paint.width, paint.height);
  
  const colors = {
    fill: 'rgba(170, 40, 190, 0.95)',
    glow: 'rgba(0, 240, 255, 0.85)',
    outline: 'rgba(0, 0, 0, 0.98)'
  };

  let groupIndex = Math.floor(p * 3);
  if(groupIndex > 2) groupIndex = 2;

  let groupProgress = (p * 3) - groupIndex;
  if(groupProgress > 1) groupProgress = 1;

  const characterStations = [
    {x: paint.width * 0.05, y: paint.height * 0.92},
    {x: paint.width * 0.30, y: paint.height * 0.92},
    {x: paint.width * 0.56, y: paint.height * 0.92}
  ];

  let currentStation = characterStations[groupIndex];
  let currentStrokeTargetX = paint.width * 0.2;
  let currentStrokeTargetY = paint.height * 0.75;

  for (let g = 0; g <= groupIndex && g < letterGroups.length; g++) {
    let strokes = letterGroups[g];
    let strokeCount = strokes.length;
    
    let activeStrokesCount = (g === groupIndex) ? Math.ceil(groupProgress * strokeCount) : strokeCount;
    if(activeStrokesCount < 1) activeStrokesCount = 1;

    for (let s = 0; s < activeStrokesCount && s < strokeCount; s++) {
      let st = strokes[s];
      let subSteps = 45; // Más pasos para un trazo más continuo
      let sp = 1.0;
      if (g === groupIndex && s === activeStrokesCount - 1) {
        let subP = (groupProgress * strokeCount) - s;
        sp = Math.max(0, Math.min(1, subP));
      }

      for (let i = 0; i <= subSteps * sp; i++) {
        let t = i / subSteps;
        let x = (st.x + (st.ex - st.x) * t) * paint.width;
        let y = (st.y + (st.ey - st.y) * t) * paint.height;

        currentStrokeTargetX = x;
        currentStrokeTargetY = y;

        let r = st.width * (0.8 + Math.sin(t * Math.PI) * 0.25);

        // Aumentado el conteo de partículas drásticamente para que se vea relleno
        if (i % 2 === 0) spray(x, y, colors.outline, r * 1.3, 25);
        if (i % 2 === 0) spray(x, y, colors.glow, r * 0.7, 20);
        spray(x, y, colors.fill, r, 45);

        // Gotas de pintura escurriendo
        if (Math.random() > 0.92) {
          let dripLen = 30 + Math.random() * 50;
          for (let d = 0; d < dripLen; d += 2) {
            pCtx.fillStyle = colors.fill;
            pCtx.globalAlpha = 1 - (d / dripLen);
            pCtx.fillRect(x + (Math.random() - 0.5) * 4, y + d, 3 + Math.random()*2, 4);
          }
          pCtx.globalAlpha = 1;
        }
      }
    }
  }

  if (p < 1) {
    drawStationaryCharacter(currentStation.x, currentStation.y, currentStrokeTargetX, currentStrokeTargetY, true);
  }
}

let anim = null;
function start() {
  cancelAnimationFrame(anim);
  let p = 0;
  (function loop() {
    p += 0.0015; // Ligeramente más lento para apreciar la animación
    if (p > 1) p = 1;
    drawGraffiti(p);
    if (p < 1) anim = requestAnimationFrame(loop);
  })();
}

function clearCanv() {
  cancelAnimationFrame(anim);
  pCtx.clearRect(0, 0, paint.width, paint.height);
  drawBackground(0);
}

window.addEventListener('resize', resize);
resize();
drawBackground(0);
</script>
</body>
</html>
