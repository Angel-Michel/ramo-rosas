<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para la pequeña Key</title>
    <style>
        /* Fondo de atardecer */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #2b1055 0%, #7597de 30%, #f6a56c 70%, #ff7b54 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* Lienzo para los fuegos artificiales */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Diseño de la tarjeta del ramo (Glassmorphism) */
        .tarjeta-ramo {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 2;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: flotar-tarjeta 4s ease-in-out infinite;
        }

        @keyframes flotar-tarjeta {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .titulo-key {
            color: #fff;
            margin-top: 0;
            font-size: 2.2em;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
            margin-bottom: 10px;
        }

        /* Estilos del ramo visual */
        .ramo-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 30px 0;
            padding: 10px;
            width: 100%;
        }

        .flor {
            margin: -12px;
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.4));
            animation: latido-flor 3s ease-in-out infinite;
            animation-delay: var(--d);
            z-index: var(--z);
        }

        @keyframes latido-flor {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        .mensaje {
            font-size: 1.2em;
            line-height: 1.6;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Lienzo donde se dibujarán los fuegos artificiales -->
    <canvas id="fuegosArtificiales"></canvas>

    <!-- Contenido de la tarjeta -->
    <div class="tarjeta-ramo">
        <h1 class="titulo-key">Para la pequeña Key 💖</h1>
        
        <!-- Ramo de rosas rojas y rosas -->
        <div class="ramo-visual">
            <div class="flor" style="--d: 0s; --z: 1; font-size: 4rem;">🌹</div>
            <div class="flor" style="--d: 0.3s; --z: 2; font-size: 3.5rem;">🌸</div>
            <div class="flor" style="--d: 0.6s; --z: 3; font-size: 4.8rem;">🌹</div>
            <div class="flor" style="--d: 0.9s; --z: 2; font-size: 3.8rem;">🌺</div>
            <div class="flor" style="--d: 1.2s; --z: 1; font-size: 4.2rem;">🌹</div>
            <div class="flor" style="--d: 1.5s; --z: 2; font-size: 3.5rem;">🌸</div>
            <div class="flor" style="--d: 1.8s; --z: 1; font-size: 4rem;">🌹</div>
        </div>

        <p class="mensaje">Un ramo de flores tan hermosas como tú. Que este atardecer ilumine tu día y nunca dejes de sonreír.</p>
    </div>

    <!-- Script de JavaScript para los fuegos artificiales -->
    <script>
        const canvas = document.getElementById('fuegosArtificiales');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particulas = [];
        const colores = ['#ff3333', '#ffaa00', '#ff00aa', '#ffffff', '#ffd700'];

        class Particula {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.r = Math.random() * 3 + 1;
                this.color = colores[Math.floor(Math.random() * colores.length)];
                
                const angulo = Math.random() * Math.PI * 2;
                const velocidad = Math.random() * 6 + 2;
                this.vx = Math.cos(angulo) * velocidad;
                this.vy = Math.sin(angulo) * velocidad;
                
                this.alpha = 1;
                this.decaimiento = Math.random() * 0.02 + 0.01;
            }

            actualizar() {
                this.x += this.vx;
                this.vy += 0.05; 
                this.y += this.vy;
                this.alpha -= this.decaimiento;
            }

            dibujar() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function crearFuegoArtificial() {
            const x = Math.random() * canvas.width;
            const y = (Math.random() * canvas.height) / 2;
            
            for (let i = 0; i < 60; i++) {
                particulas.push(new Particula(x, y));
            }
        }

        function animar() {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            
            if (Math.random() < 0.04) {
                crearFuegoArtificial();
            }

            for (let i = particulas.length - 1; i >= 0; i--) {
                particulas[i].actualizar();
                particulas[i].dibujar();
                
                if (particulas[i].alpha <= 0) {
                    particulas.splice(i, 1);
                }
            }
            requestAnimationFrame(animar);
        }

        animar();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
