
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY - Tim Burton Graffiti</title>
<style>
  body{margin:0;background:#1a1d23;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#8aa0b8}
  #wall{position:relative;width:95vw;max-width:800px;aspect-ratio:16/9;background:#15171c;border:8px solid #111;box-shadow:0 0 40px #000;overflow:hidden}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  button{background:#2b8cd6;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
</style>
</head>
<body>
<h3 style="opacity:.6;letter-spacing:4px">TIM BURTON x KEY</h3>
<div id="wall"><canvas id="bg"></canvas><canvas id="paint"></canvas></div>
<div><button onclick="start()">▶ PINTAR</button><button onclick="clearCanv()">↺ BORRAR</button></div>
<script>
const paint=document.getElementById('paint'),bg=document.getElementById('bg');
const pCtx=paint.getContext('2d'),bCtx=bg.getContext('2d');
function resize(){[paint,bg].forEach(c=>{c.width=c.offsetWidth*2;c.height=c.offsetHeight*2});}
function spray(x,y,color,radius,count){
  for(let i=0;i<count;i++){
    let a=Math.random()*6.28,d=Math.random()*radius;
    pCtx.fillStyle=color;pCtx.globalAlpha=.4+Math.random()*.5;
    pCtx.beginPath();pCtx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.random()*3+.5,0,6.28);pCtx.fill();
  }pCtx.globalAlpha=1;
}
function drawThrowUp(p){
  pCtx.clearRect(0,0,paint.width,paint.height);
  const colors={fill:'rgba(45,140,214,0.95)',outline:'rgba(140,145,150,0.95)',black:'rgba(10,10,10,0.95)'};
  let total=300,step=Math.floor(p*total);
  for(let s=0;s<step;s++){
    let t=s/total,lx=0.15+t*0.7,ly=0.4+Math.sin(t*12)*0.15;
    let x=lx*paint.width,y=ly*paint.height;
    if(s%3==0)spray(x+4,y+4,colors.black,45,12);
    if(s%2==0)spray(x,y,colors.outline,38,18);
    spray(x,y,colors.fill,28,22);
    if(Math.random()>0.92){for(let d=0;d<40;d++){pCtx.fillStyle=colors.fill;pCtx.globalAlpha=.3;pCtx.fillRect(x,y+d*2,2,4);}pCtx.globalAlpha=1;}
  }
}
let anim=null;
function start(){cancelAnimationFrame(anim);let p=0;(function loop(){p+=.007;if(p>1)p=1;drawThrowUp(p);if(p<1)anim=requestAnimationFrame(loop);})();}
function clearCanv(){cancelAnimationFrame(anim);pCtx.clearRect(0,0,paint.width,paint.height);}
window.addEventListener('resize',resize);resize();drawThrowUp(.15);
</script>
</body>
</html>
