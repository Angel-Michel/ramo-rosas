<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Ramo para Key</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            /* Degradado de atardecer denso y espectacular */
            background: linear-gradient(180deg, #100030 0%, #301040 20%, #703060 40%, #e06060 60%, #ff9060 80%, #ffb070 100%);
        }

        /* Lienzo de fuegos artificiales sutiles y coloridos */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor principal del Ramo */
        .ramo-container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 600px;
            animation: floatBouquet 4s ease-in-out infinite;
        }

        /* Título */
        .titulo {
            font-size: 2.8rem;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        .titulo .heart {
            color: #ff3366;
            display: inline-block;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        /* El Ramo Visual Denso y Grande */
        .bouquet-visual {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 30px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        /* Flores individuales */
        .flor {
            position: absolute;
            font-size: 4rem;
            animation: florFloat 3s ease-in-out infinite;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
        }

        /* Posicionamiento denso e irregular de las flores para forma de ramo */
        .flor:nth-child(1) { top: 0%; left: 30%; animation-delay: 0s; font-size: 5rem; }
        .flor:nth-child(2) { top: 10%; left: 60%; animation-delay: 0.2s; }
        .flor:nth-child(3) { top: 30%; left: 10%; animation-delay: 0.4s; }
        .flor:nth-child(4) { top: 40%; left: 80%; animation-delay: 0.6s; font-size: 5rem; }
        .flor:nth-child(5) { top: 55%; left: 35%; animation-delay: 0.8s; font-size: 4.5rem; }
        .flor:nth-child(6) { top: 65%; left: 65%; animation-delay: 1.0s; }
        .flor:nth-child(7) { top: 25%; left: 45%; animation-delay: 1.2s; font-size: 4.8rem; }
        .flor:nth-child(8) { top: 45%; left: 55%; animation-delay: 1.4s; }
        .flor:nth-child(9) { top: 50%; left: 20%; animation-delay: 1.6s; }
        .flor:nth-child(10) { top: 70%; left: 40%; animation-delay: 1.8s; font-size: 4rem; }
        .flor:nth-child(11) { top: 15%; left: 15%; animation-delay: 2.0s; }
        .flor:nth-child(12) { top: 60%; left: 85%; animation-delay: 2.2s; }

        /* Cinta del ramo */
        .ribbon {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 7rem;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
            animation: ribbonSway 2s ease-in-out infinite;
        }

        /* Mensaje */
        .mensaje {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-top: 30px;
            opacity: 0.9;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease-out;
            max-width: 450px;
            color: rgba(255, 255, 255, 0.95);
        }

        /* Animaciones */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes floatBouquet {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes florFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(3px, -4px) rotate(2deg); }
        }

        @keyframes ribbonSway {
            0%, 100% { transform: translateX(-50%) rotate(-6deg); }
            50% { transform: translateX(-50%) rotate(6deg); }
        }

    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div class="ramo-container">
        <h1 class="titulo">Para la pequeña Key <span class="heart">💖</span></h1>
        
        <div class="bouquet-visual">
            <!-- Flores individuales para un ramo denso y grande -->
            <div class="flor rose red">🌹</div>
            <div class="flor flower pink">🌸</div>
            <div class="flor rose red">🌹</div>
            <div class="flor rose red">🌹</div>
            <div class="flor flower pink">🌸</div>
            <div class="flor rose red">🌹</div>
            <div class="flor rose red">🌹</div>
            <div class="flor flower pink">🌸</div>
            <div class="flor rose red">🌹</div>
            <div class="flor flower pink">🌸</div>
            <div class="flor rose red">🌹</div>
            <div class="flor flower pink">🌸</div>
            
            <!-- Cinta del ramo -->
            <div class="ribbon">🎀</div>
        </div>

        <p class="mensaje">
            Un ramo de flores tan hermosas como tú. Que este atardecer ilumine tu día y nunca dejes de sonreír.
        </p>
    </div>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let fireworks = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * (Math.random() * 6),
                    y: (Math.random() - 0.5) * (Math.random() * 6)
                };
                this.radius = Math.random() * 2 + 1;
                this.opacity = 1;
                this.gravity = 0.05;
                this.friction = 0.99;
            }

            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.opacity -= 0.01;
            }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.5);
                this.velocity = { y: (Math.random() * -5 - 5) };
                this.radius = 2;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                this.exploded = false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.y += this.velocity.y;
                if (this.y <= this.targetY && !this.exploded) {
                    this.exploded = true;
                    this.explode();
                }
            }

            explode() {
                for (let i = 0; i < 50; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Desvanecimiento suave para la estela, pero sin oscurecer demasiado el fondo principal
            ctx.fillStyle = 'rgba(20, 10, 30, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            fireworks.forEach((firework, index) => {
                if (!firework.exploded) {
                    firework.draw();
                    firework.update();
                }
            });

            particles.forEach((particle, index) => {
                if (particle.opacity > 0) {
                    particle.draw();
                    particle.update();
                } else {
                    particles.splice(index, 1);
                }
            });

            if (Math.random() < 0.03) {
                fireworks.push(new Firework());
            }
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
