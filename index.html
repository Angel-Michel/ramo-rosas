<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY - Tim Burton Graffiti</title>
<style>
  body{margin:0;background:#1a1d23;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#8aa0b8}
  #wall{position:relative;width:95vw;max-width:800px;aspect-ratio:16/9;background:#15171c;border:8px solid #111;box-shadow:0 0 40px #000;overflow:hidden}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  button{background:#2b8cd6;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px;transition:0.2s}
  button:hover{background:#359fe6;transform:scale(1.05)}
</style>
</head>
<body>
<h3 style="opacity:.6;letter-spacing:4px">TIM BURTON x KEY</h3>
<div id="wall"><canvas id="bg"></canvas><canvas id="paint"></canvas></div>
<div><button onclick="start()">▶ PINTAR</button><button onclick="clearCanv()">↺ BORRAR</button></div>

<script>
const paint = document.getElementById('paint'), bg = document.getElementById('bg');
const pCtx = paint.getContext('2d'), bCtx = bg.getContext('2d');

function resize() {
  [paint, bg].forEach(c => { c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; });
}

// Trayectoria de trazos para formar la palabra "KEY" con estilo anguloso/gótico
const segments = [
  // Letra K
  {x1:0.18, y1:0.25, x2:0.18, y2:0.75}, // Palo vertical
  {x1:0.18, y1:0.50, x2:0.32, y2:0.28}, // Diagonal arriba
  {x1:0.24, y1:0.45, x2:0.34, y2:0.75}, // Diagonal abajo
  
  // Letra E
  {x1:0.42, y1:0.25, x2:0.42, y2:0.75}, // Palo vertical
  {x1:0.42, y1:0.25, x2:0.58, y2:0.25}, // Barra arriba
  {x1:0.42, y1:0.50, x2:0.54, y2:0.50}, // Barra media
  {x1:0.42, y1:0.75, x2:0.58, y2:0.75}, // Barra abajo
  
  // Letra Y
  {x1:0.66, y1:0.25, x2:0.73, y2:0.50}, // Brazo izq
  {x1:0.80, y1:0.25, x2:0.73, y2:0.50}, // Brazo der
  {x1:0.73, y1:0.50, x2:0.73, y2:0.75}  // Tallo central
];

function spray(x, y, color, radius, count) {
  for(let i = 0; i < count; i++) {
    let a = Math.random() * 6.28, d = Math.random() * radius;
    pCtx.fillStyle = color; 
    pCtx.globalAlpha = 0.4 + Math.random() * 0.5;
    pCtx.beginPath();
    pCtx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.random() * 2.5 + 0.5, 0, 6.28);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
}

// Dibuja un mini personaje estilo Tim Burton (silueta delgada, cabeza redonda, extremidades finas y aerosol)
function drawBurtonCharacter(x, y) {
  pCtx.save();
  pCtx.fillStyle = '#0a0a0a';
  pCtx.strokeStyle = '#0a0a0a';
  pCtx.lineWidth = 4;

  let charX = x - 35;
  let charY = y + 20;

  // Cuerpo delgado y encorvado
  pCtx.beginPath();
  pCtx.moveTo(charX, charY);
  pCtx.lineTo(charX + 10, charY - 25);
  pCtx.lineTo(charX + 20, charY);
  pCtx.stroke();

  // Cabeza grande y redonda típica de Burton
  pCtx.beginPath();
  pCtx.arc(charX + 10, charY - 35, 12, 0, Math.PI * 2);
  pCtx.fill();

  // Brazos extendidos sosteniendo el spray hacia el punto (x, y)
  pCtx.beginPath();
  pCtx.moveTo(charX + 10, charY - 22);
  pCtx.lineTo(x, y);
  pCtx.stroke();

  // Bote de spray en la mano
  pCtx.fillStyle = '#2b8cd6';
  pCtx.fillRect(x - 6, y - 10, 12, 18);

  pCtx.restore();
}

function drawGraffiti(p) {
  pCtx.clearRect(0, 0, paint.width, paint.height);
  
  const colors = {
    fill: 'rgba(43, 140, 214, 0.95)',
    outline: 'rgba(160, 175, 190, 0.95)',
    black: 'rgba(10, 10, 10, 0.95)'
  };

  let totalSteps = segments.length;
  let currentSegmentIndex = Math.floor(p * totalSteps);
  let segmentProgress = (p * totalSteps) - currentSegmentIndex;

  // Dibujar los segmentos ya completados o en proceso
  for (let s = 0; s <= currentSegmentIndex && s < totalSteps; s++) {
    let seg = segments[s];
    let sp = (s === currentSegmentIndex) ? segmentProgress : 1.0;
    
    let subSteps = 25;
    for (let i = 0; i <= subSteps * sp; i++) {
      let t = i / subSteps;
      let x = (seg.x1 + (seg.x2 - seg.x1) * t) * paint.width;
      let y = (seg.y1 + (seg.y2 - seg.y1) * t) * paint.height;

      if (i % 2 === 0) spray(x + 4, y + 4, colors.black, 30, 8);
      if (i % 2 === 0) spray(x, y, colors.outline, 25, 12);
      spray(x, y, colors.fill, 18, 15);

      // Efecto de goteo gótico ocasional
      if (Math.random() > 0.96) {
        for (let d = 0; d < 30; d++) {
          pCtx.fillStyle = colors.fill;
          pCtx.globalAlpha = 0.4;
          pCtx.fillRect(x, y + (d * 2), 2, 3);
        }
        pCtx.globalAlpha = 1;
      }
    }
  }

  // Obtener la posición actual exacta del spray para ubicar al personaje
  if (p < 1 && currentSegmentIndex < totalSteps) {
    let seg = segments[currentSegmentIndex];
    let curX = (seg.x1 + (seg.x2 - seg.x1) * segmentProgress) * paint.width;
    let curY = (seg.y1 + (seg.y2 - seg.y1) * segmentProgress) * paint.height;
    drawBurtonCharacter(curX, curY);
  }
}

let anim = null;
function start() {
  cancelAnimationFrame(anim);
  let p = 0;
  (function loop() {
    p += 0.003; // Velocidad de animación
    if (p > 1) p = 1;
    drawGraffiti(p);
    if (p < 1) anim = requestAnimationFrame(loop);
  })();
}

function clearCanv() {
  cancelAnimationFrame(anim);
  pCtx.clearRect(0, 0, paint.width, paint.height);
}

window.addEventListener('resize', resize);
resize();
drawGraffiti(0.15);
</script>
</body>
</html>
