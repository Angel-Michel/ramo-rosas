<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY - Tim Burton Ultimate Graffiti</title>
<style>
  body{margin:0;background:#050608;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;color:#a0b0c0}
  #wall{position:relative;width:95vw;max-width:800px;aspect-ratio:16/9;background:#08090e;border:8px solid #111;box-shadow:0 0 60px rgba(123,31,162,0.3);overflow:hidden}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  div > button{background:#7b1fa2;color:white;border:none;padding:10px 22px;border-radius:8px;font-weight:bold;cursor:pointer;margin:8px;transition:0.2s;box-shadow:0 4px 15px rgba(123,31,162,0.4)}
  div > button:hover{background:#9c27b0;transform:scale(1.08)}
</style>
</head>
<body>
<h3 style="opacity:.8;letter-spacing:5px;color:#ce93d8">TIM BURTON x KEY</h3>
<div id="wall">
  <canvas id="bg"></canvas>
  <canvas id="paint"></canvas>
</div>
<div>
  <button onclick="start()">▶ PINTAR</button>
  <button onclick="clearCanv()">↺ BORRAR</button>
</div>

<script>
const paint = document.getElementById('paint'), bg = document.getElementById('bg');
const pCtx = paint.getContext('2d'), bCtx = bg.getContext('2d');

function resize() {
  [paint, bg].forEach(c => { c.width = c.offsetWidth * 2; c.height = c.offsetHeight * 2; });
  drawBackground();
}

// Fondo gótico animable con colinas, luna, árboles retorcidos y murciélagos
let bats = [
  {x: 600, y: 150, speed: 1.2, size: 8, wingState: 0},
  {x: 680, y: 120, speed: 1.5, size: 6, wingState: 2},
  {x: 520, y: 200, speed: 0.9, size: 10, wingState: 1}
];

function drawBackground() {
  const w = bg.width, h = bg.height;
  bCtx.clearRect(0, 0, w, h);
  
  // Cielo nocturno con degradado profundo
  let grad = bCtx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#030406');
  grad.addColorStop(0.6, '#0f101c');
  grad.addColorStop(1, '#180e24');
  bCtx.fillStyle = grad;
  bCtx.fillRect(0, 0, w, h);

  // Luna pálida con brillo brumoso
  bCtx.fillStyle = 'rgba(200, 230, 255, 0.1)';
  bCtx.beginPath(); bCtx.arc(w * 0.78, h * 0.28, 90, 0, Math.PI * 2); bCtx.fill();
  bCtx.fillStyle = 'rgba(210, 240, 255, 0.85)';
  bCtx.beginPath(); bCtx.arc(w * 0.78, h * 0.28, 55, 0, Math.PI * 2); bCtx.fill();

  // Cráteres sutiles en la luna
  bCtx.fillStyle = 'rgba(180, 205, 220, 0.4)';
  bCtx.beginPath(); bCtx.arc(w * 0.76, h * 0.26, 12, 0, Math.PI * 2); bCtx.fill();
  bCtx.beginPath(); bCtx.arc(w * 0.81, h * 0.32, 8, 0, Math.PI * 2); bCtx.fill();

  // Colinas retorcidas estilo Tim Burton
  bCtx.fillStyle = '#050608';
  bCtx.beginPath();
  bCtx.moveTo(0, h);
  bCtx.lineTo(0, h * 0.72);
  bCtx.bezierCurveTo(w * 0.2, h * 0.58, w * 0.38, h * 0.82, w * 0.6, h * 0.68);
  bCtx.bezierCurveTo(w * 0.82, h * 0.5, w * 0.9, h * 0.78, w, h * 0.65);
  bCtx.lineTo(w, h);
  bCtx.closePath();
  bCtx.fill();

  // Árboles nudosos oscuros a los costados
  bCtx.strokeStyle = '#020304';
  bCtx.lineWidth = 14;
  bCtx.lineCap = 'round';
  bCtx.beginPath();
  bCtx.moveTo(w * 0.07, h);
  bCtx.lineTo(w * 0.1, h * 0.5);
  bCtx.bezierCurveTo(w * 0.02, h * 0.4, w * 0.16, h * 0.28, w * 0.06, h * 0.15);
  bCtx.stroke();

  // Murciélagos volando en el fondo
  bats.forEach(b => {
    b.x -= b.speed;
    if(b.x < -50) b.x = w + 50;
    b.wingState += 0.2;
    let wingOffset = Math.sin(b.wingState) * b.size;

    bCtx.fillStyle = '#020304';
    bCtx.beginPath();
    bCtx.moveTo(b.x, b.y);
    bCtx.quadraticCurveTo(b.x - b.size, b.y - b.size - wingOffset, b.x - b.size * 2, b.y - wingOffset * 0.5);
    bCtx.quadraticCurveTo(b.x - b.size, b.y + 2, b.x, b.y + 3);
    bCtx.quadraticCurveTo(b.x + b.size, b.y + 2, b.x + b.size * 2, b.y - wingOffset * 0.5);
    bCtx.quadraticCurveTo(b.x + b.size, b.y - b.size - wingOffset, b.x, b.y);
    bCtx.fill();
  });
}

// Trazos ligeramente orgánicos y retorcidos para "KEY"
const letterStrokes = [
  // K
  {x:0.17, y:0.24, ex:0.18, ey:0.76, width:40},
  {x:0.18, y:0.48, ex:0.32, ey:0.24, width:32},
  {x:0.22, y:0.44, ex:0.34, ey:0.76, width:32},
  // E
  {x:0.43, y:0.24, ex:0.43, ey:0.76, width:40},
  {x:0.43, y:0.24, ex:0.61, ey:0.26, width:28},
  {x:0.43, y:0.50, ex:0.57, ey:0.52, width:26},
  {x:0.43, y:0.76, ex:0.61, ey:0.74, width:28},
  // Y
  {x:0.69, y:0.24, ex:0.77, ey:0.48, width:32},
  {x:0.85, y:0.24, ex:0.77, ey:0.48, width:32},
  {x:0.77, y:0.48, ex:0.77, ey:0.76, width:36}
];

function spray(x, y, color, radius, count) {
  for(let i = 0; i < count; i++) {
    let a = Math.random() * Math.PI * 2, d = Math.random() * radius;
    pCtx.fillStyle = color; 
    pCtx.globalAlpha = 0.45 + Math.random() * 0.45;
    pCtx.beginPath();
    pCtx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, Math.random() * 3.5 + 0.8, 0, Math.PI * 2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
}

// Mini personaje detallado estilo Tim Burton (con cabello alborotado y gabardina)
function drawBurtonCharacter(x, y, progress) {
  pCtx.save();
  let charX = x - 55;
  let charY = y + 28;

  // Sombra en el suelo
  pCtx.fillStyle = 'rgba(0,0,0,0.6)';
  pCtx.beginPath();
  pCtx.ellipse(charX + 18, charY + 12, 16, 5, 0, 0, Math.PI * 2);
  pCtx.fill();

  pCtx.strokeStyle = '#030406';
  pCtx.lineWidth = 3.5;
  pCtx.lineCap = 'round';
  pCtx.lineJoin = 'round';

  // Piernas delgadas arqueadas
  pCtx.beginPath();
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 8, charY + 14);
  pCtx.moveTo(charX + 18, charY);
  pCtx.lineTo(charX + 28, charY + 14);
  pCtx.stroke();

  // Gabardina larga y oscura ondeando ligeramente
  pCtx.fillStyle = '#0d0f17';
  let windWobble = Math.sin(progress * 40) * 3;
  pCtx.beginPath();
  pCtx.moveTo(charX + 10, charY - 22);
  pCtx.lineTo(charX + 26, charY - 22);
  pCtx.lineTo(charX + 28 + windWobble, charY);
  pCtx.lineTo(charX + 8 + windWobble, charY);
  pCtx.closePath();
  pCtx.fill();
  pCtx.stroke();

  // Cabeza redonda pálida
  pCtx.fillStyle = '#e2e8f0';
  pCtx.beginPath();
  pCtx.arc(charX + 18, charY - 32, 14, 0, Math.PI * 2);
  pCtx.fill();
  pCtx.stroke();

  // Cabello clásico alborotado estilo Tim Burton (puntas hacia arriba)
  pCtx.fillStyle = '#030406';
  pCtx.beginPath();
  pCtx.moveTo(charX + 6, charY - 38);
  pCtx.lineTo(charX + 10, charY - 50);
  pCtx.lineTo(charX + 14, charY - 42);
  pCtx.lineTo(charX + 18, charY - 53);
  pCtx.lineTo(charX + 22, charY - 42);
  pCtx.lineTo(charX + 26, charY - 48);
  pCtx.lineTo(charX + 30, charY - 36);
  pCtx.fill();

  // Ojos grandes expresivos
  pCtx.beginPath();
  pCtx.arc(charX + 13, charY - 34, 3.5, 0, Math.PI * 2);
  pCtx.arc(charX + 22, charY - 34, 3.5, 0, Math.PI * 2);
  pCtx.fill();

  // Brazos dinámicos sosteniendo el spray
  pCtx.beginPath();
  pCtx.moveTo(charX + 18, charY - 18);
  pCtx.lineTo(x, y);
  pCtx.stroke();

  // Bote de aerosol con diseño neón
  pCtx.fillStyle = '#9c27b0';
  pCtx.fillRect(x - 7, y - 11, 15, 20);
  pCtx.fillStyle = '#00e5ff';
  pCtx.fillRect(x - 4, y - 15, 8, 4);

  pCtx.restore();
}

function drawGraffiti(p) {
  drawBackground(); // Redibuja el fondo y mueve los murciélagos en cada frame
  
  const colors = {
    fill: 'rgba(156, 39, 176, 0.95)',   // Morado vibrante Burton
    glow: 'rgba(0, 229, 255, 0.85)',     // Cian eléctrico
    outline: 'rgba(3, 4, 6, 0.95)'       // Tinta negra
  };

  let totalStrokes = letterStrokes.length;
  let currentIdx = Math.floor(p * totalStrokes);
  let strokeProgress = (p * totalStrokes) - currentIdx;

  for (let s = 0; s <= currentIdx && s < totalStrokes; s++) {
    let st = letterStrokes[s];
    let sp = (s === currentIdx) ? strokeProgress : 1.0;
    
    let subSteps = 35;
    for (let i = 0; i <= subSteps * sp; i++) {
      let t = i / subSteps;
      let x = (st.x + (st.ex - st.x) * t) * paint.width;
      let y = (st.y + (st.ey - st.y) * t) * paint.height;

      let r = st.width * (0.8 + Math.sin(t * Math.PI) * 0.25);

      if (i % 2 === 0) spray(x + 5, y + 5, colors.outline, r * 1.2, 10);
      if (i % 3 === 0) spray(x, y, colors.glow, r * 0.55, 12);
      spray(x, y, colors.fill, r, 18);

      // Goteos largos y estéticos
      if (Math.random() > 0.95) {
        let dripLen = 30 + Math.random() * 45;
        for (let d = 0; d < dripLen; d += 2) {
          pCtx.fillStyle = colors.fill;
          pCtx.globalAlpha = 0.9;
          pCtx.fillRect(x + (Math.random() - 0.5) * 3, y + d, 2.5, 4);
        }
        pCtx.globalAlpha = 1;
      }
    }
  }

  // Dibujar al personaje animado en la punta del spray
  if (p < 1 && currentIdx < totalStrokes) {
    let st = letterStrokes[currentIdx];
    let curX = (st.x + (st.ex - st.x) * strokeProgress) * paint.width;
    let curY = (st.y + (st.ey - st.y) * strokeProgress) * paint.height;
    drawBurtonCharacter(curX, curY, p);
  }
}

let anim = null;
function start() {
  cancelAnimationFrame(anim);
  let p = 0;
  (function loop() {
    p += 0.0022; // Velocidad suave
    if (p > 1) p = 1;
    drawGraffiti(p);
    if (p < 1) anim = requestAnimationFrame(loop);
  })();
}

function clearCanv() {
  cancelAnimationFrame(anim);
  pCtx.clearRect(0, 0, paint.width, paint.height);
  drawBackground();
}

window.addEventListener('resize', resize);
resize();
drawGraffiti(0.12);
</script>
</body>
</html>
